<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; }
  #root { display: grid; grid-template-columns: 1fr 1fr; }
</style>
</head>
<body>
<div id="root"></div>
<script src="__BOKEH_JS__"></script>
<script src="__BOKEH_API_JS__"></script>
<script>
const {figure, show, gridplot} = Bokeh.Plotting

const N = 200
const sources = []
const plots = []

function make_data(phase) {
  const x = [], y = []
  for (let i = 0; i < N; i++) {
    x.push(i)
    y.push(Math.sin(i / 10 + phase) * 10 + Math.cos(i / 3 + phase))
  }
  return {x, y}
}

for (let p = 0; p < 4; p++) {
  const src = new Bokeh.ColumnDataSource({data: make_data(p)})
  sources.push(src)
  const fig = figure({width: 400, height: 300, title: `plot ${p}`,
                      tools: "pan,wheel_zoom,box_zoom,reset"})
  // several renderers per plot, as in a real multi-layer dashboard cell
  fig.line({field: "x"}, {field: "y"}, {source: src, line_width: 2, line_color: "navy"})
  fig.scatter({field: "x"}, {field: "y"}, {source: src, size: 3, fill_color: "orange"})
  plots.push(fig)
}

const grid = gridplot([[plots[0], plots[1]], [plots[2], plots[3]]])
show(grid, "#root")

// Streaming-like steady-state update: replace y data on every frame.
let phase = 0
window.__push_frame = function() {
  phase += 0.1
  for (const src of sources) {
    src.data = make_data(phase)
  }
}

// Emulates Target 2's environment: something else on the page dirties styles
// every frame, so the CSS engine cannot serve getComputedStyle from cache.
const churn_el = document.createElement("style")
document.head.appendChild(churn_el)
let churn_n = 0
window.__dirty_styles = function() {
  churn_n++
  churn_el.textContent = `#root { --churn-${churn_n}: ${churn_n}px; }`
}

window.__ready = true
</script>
</body>
</html>
